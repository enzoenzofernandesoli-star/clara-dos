<script>
document.querySelectorAll('.pratica').forEach(function(box){
  var placar=box.querySelector('.placar'); var total=box.querySelectorAll('.q.mc').length; var ac=0;
  box.querySelectorAll('.q.mc').forEach(function(q){
    var certa=+q.dataset.certa;
    q.querySelectorAll('.op').forEach(function(b){
      b.addEventListener('click',function(){
        var i=+b.dataset.i; var bs=q.querySelectorAll('.op');
        bs.forEach(function(x){x.disabled=true});
        bs[certa].classList.add('certa');
        var fb=q.querySelector('.fb'), t=q.querySelector('.fbt');
        if(i===certa){ac++;t.textContent='Certo.';t.className='fbt ok'} else {b.classList.add('errada');t.textContent='Não. Resposta: '+String.fromCharCode(65+certa)+'.';t.className='fbt no'}
        fb.hidden=false; placar.textContent=ac+' de '+total;
      });
    });
  });
  var r=document.createElement('button'); r.type='button'; r.className='refazer'; r.textContent='Refazer estas perguntas';
  r.addEventListener('click',function(){ac=0;placar.textContent='0 de '+total;box.querySelectorAll('.op').forEach(function(x){x.disabled=false;x.classList.remove('certa','errada')});box.querySelectorAll('.fb').forEach(function(f){f.hidden=true});box.querySelectorAll('details').forEach(function(d){d.open=false})});
  box.appendChild(r);
});
</script>
</body>
